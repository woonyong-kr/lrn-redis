services:
  redis-reference:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis-reference
    ports:
      - "${REDIS_REFERENCE_HOST_PORT:-6379}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "0"
      - --maxmemory-policy
      - noeviction
    networks:
      - bench-net

  mini-redis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-redis
    ports:
      - "${MINI_REDIS_HOST_PORT:-6380}:${MINI_REDIS_SERVER_PORT:-6379}"
    environment:
      PYTHONUNBUFFERED: "1"
      MINI_REDIS_HOST: ${MINI_REDIS_HOST:-0.0.0.0}
      MINI_REDIS_PORT: ${MINI_REDIS_SERVER_PORT:-6379}
      MINI_REDIS_READ_CHUNK: ${MINI_REDIS_READ_CHUNK:-4096}
      MINI_REDIS_EXPIRY_LOOP_INTERVAL_MS: ${MINI_REDIS_EXPIRY_LOOP_INTERVAL_MS:-100}
      MINI_REDIS_EXPIRY_SAMPLE_SIZE: ${MINI_REDIS_EXPIRY_SAMPLE_SIZE:-20}
      MINI_REDIS_EXPIRY_MAX_PASSES: ${MINI_REDIS_EXPIRY_MAX_PASSES:-4}
      MINI_REDIS_MAXMEMORY: "0"
      MINI_REDIS_MAXMEMORY_POLICY: noeviction
      MINI_REDIS_APPENDONLY: "no"
      MINI_REDIS_RDB_ENABLED: "no"
      MINI_REDIS_RDB_SAVE_INTERVAL_SECONDS: "0"
      MINI_REDIS_CLIENT_IDLE_TIMEOUT_SECONDS: ${MINI_REDIS_CLIENT_IDLE_TIMEOUT_SECONDS:-30}
      MINI_REDIS_WRITE_DRAIN_TIMEOUT_SECONDS: ${MINI_REDIS_WRITE_DRAIN_TIMEOUT_SECONDS:-5}
      MINI_REDIS_MAX_INPUT_BUFFER_BYTES: ${MINI_REDIS_MAX_INPUT_BUFFER_BYTES:-1048576}
      MINI_REDIS_MAX_OUTPUT_BUFFER_BYTES: ${MINI_REDIS_MAX_OUTPUT_BUFFER_BYTES:-262144}
      MINI_REDIS_MAX_COMMANDS_PER_TICK: ${MINI_REDIS_MAX_COMMANDS_PER_TICK:-128}
      MINI_REDIS_LOG_LEVEL: ${MINI_REDIS_LOG_LEVEL:-INFO}
    networks:
      - bench-net

  benchmark:
    build:
      context: ./benchmark
      dockerfile: Dockerfile
    container_name: benchmark
    depends_on:
      - redis-reference
      - mini-redis
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_REFERENCE_HOST: ${BENCH_REDIS_REFERENCE_HOST:-redis-reference}
      REDIS_REFERENCE_PORT: ${BENCH_REDIS_REFERENCE_PORT:-6379}
      REDIS_REFERENCE_IMAGE: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      MINI_REDIS_HOST: ${BENCH_MINI_REDIS_HOST:-mini-redis}
      MINI_REDIS_PORT: ${BENCH_MINI_REDIS_PORT:-6379}
      BENCH_ROUNDS: ${BENCH_ROUNDS:-5}
      BENCH_ITERATIONS: ${BENCH_ITERATIONS:-1000}
      BENCH_WARMUP: ${BENCH_WARMUP:-100}
      BENCH_PIPELINE_BATCH: ${BENCH_PIPELINE_BATCH:-100}
      BENCH_VALUE_SIZE: ${BENCH_VALUE_SIZE:-64}
      BENCH_KEY_COUNT: ${BENCH_KEY_COUNT:-200}
      BENCH_LEADERBOARD_PLAYERS: ${BENCH_LEADERBOARD_PLAYERS:-500}
      BENCH_SOCKET_TIMEOUT_SECONDS: ${BENCH_SOCKET_TIMEOUT_SECONDS:-5}
    volumes:
      - ./benchmark/results:/app/results
    networks:
      - bench-net
    command: >
      sh -c "python -u compatibility.py && python -u benchmark.py"

networks:
  bench-net:
    driver: bridge
